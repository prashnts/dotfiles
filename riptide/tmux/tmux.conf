# The config is mashup of (thanks!):
# * http://dotshare.it/dots/830/
# * http://sc0ty.pl/2015/12/reasonable-mouse-support-in-tmux/
# * https://github.com/gpakosz/.tmux
# * https://wiki.archlinux.org/index.php/tmux#Correct_the_TERM_variable_according_to_terminal_type
#
# Screenshot: http://imgur.com/a/e6n1B
#
# Keys (prefix = C-b or C-a, then):
#   v / -        split side by side / stacked (in the pane's dir)
#   h j k l      move between panes (repeatable)
#   H J K L      resize pane (repeatable)
#   < >          swap pane with previous / next
#   c  n p  1-9  new / next / prev / go to window; & kills it, no confirm
#   z            zoom pane, x kills it
#   [            copy mode: v select, y yank, q quit; ] pastes
#   d  s         detach / pick session; r reloads this file; ? lists keys
# Mouse: wheel scrolls (or sends arrows to less/man), drag tabs to reorder.

set -g default-terminal "screen-256color"
# Enable 24bit color support.
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm*:RGB"

set -g history-limit 10000

set -g monitor-activity on
set -g visual-activity off

set -g xterm-keys on
set -sg escape-time 0
set -sg repeat-time 600
#set -s quiet on
set -s focus-events on

# Saner mouse support.
set -g mouse on
bind-key -n WheelUpPane \
  if-shell -Ft= "#{?pane_in_mode,1,#{mouse_button_flag}}" \
    "send-keys -M" \
    "if-shell -Ft= '#{alternate_on}' \
        'send-keys Up Up Up' \
        'copy-mode -e'"
bind-key -n WheelDownPane \
  if-shell -Ft= "#{?pane_in_mode,1,#{mouse_button_flag}}" \
    "send-keys -M" \
    "send-keys Down Down Down"
bind-key -n MouseDrag1Status swap-window -t=
bind-key -n MouseDrag1Pane \
  if-shell -Ft = "#{mouse_any_flag}" \
    "if -Ft= '#{pane_in_mode}' \
      'copy-mode -M' \
      'send-keys -M'" \
    "copy-mode -M"

# Copy mode: vi keys like the shell; yank to the system clipboard (OSC 52).
setw -g mode-keys vi
set -s set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on

# Intervals
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 2

# pane navigation
bind & kill-window
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# splits keep the current dir; h was a split too, which hid pane-left
bind v split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# command prefix
set -g prefix2 C-a
bind C-a send-prefix -2

# Title bar
set -g set-titles on
set -g set-titles-string '#W ⌁ tmux'

# Color Constant
gray='#444444'
blue='#00afff'
yellow='#fca311'
dark='#1d2d44'
platinum='#e5e5e5'
yankees_blue='#14213d'
dark_tangerine='#fca311'
eerie_black='#0d1321'
shadow_blue='#748cab'
deep_space='#3e5c76'
electric_blue='#054a91'
space_cadet='#192a51'
metallic_seaweed='#0c7489'
bluegreen='#119da4'
rich_maroon='#a53860'
independence='#4b3f72'
dark_terracotta='#d05353'

tab_inactive_fg='#40bffe'
tab_inactive_bg='#17110c'

tab_activity_fg='#15e0dc'
tab_activity_bg='#154caa'

tab_selected_fg='#f7fffc'
tab_selected_bg='#0073e5'

set -g status on
set -g status-justify "left"
set -g status-style "bg=colour234"
set -g status-left-style "none"

set -g message-command-style "fg=colour144,bg=$independence"
set -g message-style "fg=$platinum,bg=$metallic_seaweed"

set -g pane-border-style "fg=$yankees_blue"
set -g pane-active-border-style "fg=$electric_blue"

set -g status-right-style "none"
set -g status-right-length "100"
set -g status-left-length "100"

set -g status-left ""

status_prefix_mark='#[fg=colour144]#{?client_prefix,⎇, }'
status_clock='#[fg=colour237,bg=colour234]#[fg=colour144,bg=colour237] %R'
set -g status-right "$status_prefix_mark $status_clock #(loadavg)#(ifstatf) "

setw -g window-status-separator ""
setw -g window-status-style           "bg=$tab_inactive_bg,fg=$tab_inactive_fg"
setw -g window-status-activity-style  "bg=$tab_activity_bg,fg=$tab_activity_fg"
# name cut/padded to 8 natively (was a shell per tab every 2 s)
setw -g window-status-format          "  #{p8:#{=8:window_name}}  "
setw -g window-status-current-format  "#[bg=$tab_selected_bg,fg=$tab_selected_fg]  #{p8:#{=8:window_name}}  "
